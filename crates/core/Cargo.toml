[package]
name = "spaghettio_core"
version = "0.1.0"
edition = "2021"

[features]
default = []
wasm = ["dep:tsify-next", "dep:wasm-bindgen"]

[dependencies]
base64 = "0.22"
flate2 = "1"
indexmap = { version = "2.13.1", features = ["serde"] }
# LP backend for the net-flow solver (docs/rfc-solver-net-flow.md).
# Pure Rust, WASM-clean, deterministic pivoting. NOTE: LinearExpr panics on
# duplicate variables in one constraint — coefficients must be netted per
# (item, recipe) before insertion (see netflow.rs).
microlp = "0.4.0"
ordered-float = "4"
rayon = "1.10"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
varisat = "0.2"
tsify-next = { version = "0.5", features = ["js"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
# Drop-in Instant replacement: uses `performance.now()` under WASM and
# `std::time::Instant` elsewhere. Fixes 0ms trace timings in the browser.
web-time = "1"

[dev-dependencies]
ntest = "0.9"

# sim_export is the tracked fixture generator; its label logic decides the
# OUTPUT DIRECTORY, so a regression there silently re-collides A/B fixtures
# (#661). Declared explicitly with `test = true` so its unit tests actually
# RUN: `cargo test` BUILDS examples but does not RUN their tests by default.
#
# Measured, because a review disputed it (#661 round 5) — plain
# `cargo test`, grepping for two of the label tests by name:
#   stanza removed  -> 0 matches
#   stanza present  -> 2 matches
# Not a no-op. Note the distinction that makes it easy to get wrong:
# `cargo test --example sim_export` runs them either way, because naming a
# target selects it; the default target set is what the stanza changes.
[[example]]
name = "sim_export"
path = "examples/sim_export.rs"
test = true

[[example]]
name = "calibration_matrix_export"
path = "examples/calibration_matrix_export.rs"
test = true
