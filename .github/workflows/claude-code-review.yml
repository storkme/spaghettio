name: Claude Code Review

on:
  pull_request:
    # `edited` closes one specific hole: the bot files real findings against
    # the PR *description* (missing template sections, body claims the diff
    # contradicts), and fixing those means editing the body — which pushes
    # nothing, so no `synchronize` fires and the finding is never confirmed
    # closed. Observed 2026-07-29 on #493/#494: a template finding was fixed
    # in the body, and the next round's summary still reported it "already on
    # record and unchanged". The job's `if` below keeps this from turning
    # every typo fix into an 11-minute review.
    types: [opened, synchronize, ready_for_review, reopened, edited]

# A review takes 8-11 minutes and fires per push, so a burst of pushes leaves
# several runs racing over superseded heads. Cancelling is safe *because* the
# guard enforces coverage on the CURRENT head: the surviving run reviews the
# only SHA that can be merged. Keyed by PR so PRs never cancel each other.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Re-enabled 2026-07-29 (disabled 2026-07-26 by user request). While it
    # was off the `claude-review` check reported "skipping" on every PR, which
    # is indistinguishable at a glance from the silent-failure classes this
    # workflow was hardened against — see docs/review-bot.md.
    #
    # THIS JOB HAS NO `if:` ON PURPOSE — do not add one (#497).
    #
    # `claude-review` is a REQUIRED status check on main (enforce_admins:
    # true, see scripts/review-gate.sh). A job skipped by a job-level `if`
    # still publishes a check run named `claude-review`, with conclusion
    # `skipped`, against a head SHA that may already carry a passing one —
    # and required-check evaluation reads the latest. Whether GitHub counts
    # `skipped` as a pass is not something to bet a merge queue on.
    #
    # So the job always runs and always reports a real conclusion, and the
    # conditions live on the steps instead. Cost is a runner spin-up
    # (seconds) for events with nothing to review; the guard below exits
    # early on those.
    runs-on: ubuntu-latest
    # `pull-requests`/`issues` must be WRITE: the review agent posts its
    # findings as a PR review + inline/summary comments. The stock template
    # ships read-only, which silently discarded every review (failure
    # class 1 in docs/review-bot.md).
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Three load-bearing pieces below, each individually sufficient to
      # silently disable the bot when lost (classes 1-4 in
      # docs/review-bot.md — the installer overwrite wiped all of them at
      # once): write perms above, the `--comment` flag in the prompt, and
      # the harness allowlist in claude_args. The prompt's harness note
      # addresses class 5 (shape-sensitive denial starvation): denials of
      # improvised command shapes (env prefixes, $(...), cd-chains, gh api)
      # made runs abandon mid-review without posting.
      - name: Run Claude Code Review
        id: claude-review
        # Two gates, both moved here from the job level so a no-op event still
        # reports a real check conclusion (#497):
        #
        # 1. `edited` fires on title, body and base-branch changes alike. A
        #    title edit changes nothing reviewable; a body edit gets the cheap
        #    description-only re-check the prompt describes; a base change
        #    silently rewrites the whole diff and gets a full review.
        # 2. Fork PRs get no secrets from `pull_request` (by design — not a
        #    leak), so the action would fail on an empty token. Advisory that
        #    was noise; required it is an unclearable merge block for an
        #    outside contributor.
        if: >-
          (github.event.action != 'edited' ||
           github.event.changes.body != null ||
           github.event.changes.base != null) &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
            — Harness note for you and EVERY subagent you launch: tool
            permissions here match command SHAPES, not intent. Run gh
            commands as plain single invocations — no env-var prefixes
            (`GH_PAGER= gh ...`), no command substitution `$(...)`, no
            `cd ... &&` chaining, no `gh api` — only plain `gh pr
            view/diff/comment`, `gh issue view/list`, `gh search`. A
            permission denial means your command shape missed the
            allowlist, NOT that tools are broken: re-issue the same
            command in plain allowed form and continue the review. Never
            abandon the review because of denials; if you have findings
            or a no-issues verdict, exhaust plain `gh pr comment` before
            giving up on posting. You are running ONE-SHOT and headless:
            never use ScheduleWakeup, background tasks, or any
            wait-for-later mechanism — a parked session simply ends and
            the review is lost (observed 2026-07-24, PR #416: the
            orchestrator scheduled a wakeup to wait for its subagents
            and ended mid-wait). Launch subagents and consume their
            results synchronously within this run. If you consciously
            decide NOT to review (triviality gate, out-of-scope diff,
            already reviewed), do not end silently — post a one-line
            `gh pr comment` stating the skip and the reason. A silent
            end is indistinguishable from a crash and fails the check.
            — Re-review rule: "I already reviewed this PR" is NOT a valid
            skip when new commits have landed since. This job fires on
            every push, and the guard below only checks that the PR has
            SOME review in its lifetime, so a skip here means the new
            commits get no review at all — which is exactly how a PR that
            was reviewed at its third commit merged at its ninth (#481,
            2026-07-29: four real bugs found, then six further commits
            including the fixes for those bugs went unreviewed). When
            ${{ github.event.action }} is `synchronize`, review the
            commits from ${{ github.event.before }} to
            ${{ github.event.after }} — focus there, judge them in the
            context of the whole PR, and say in your comment which range
            you reviewed. Re-check that earlier findings were actually
            addressed rather than assuming. Only the triviality gate
            (genuinely no substantive change in the range) justifies a
            skip, and it still needs the one-line comment.
            — Description-edit runs: when ${{ github.event.action }} is
            `edited`, the code has NOT changed — the PR description has.
            Do NOT re-review the diff. Read the current description, then
            re-check ONLY the findings that were scoped to it (missing
            template sections, body claims the diff contradicts, stale
            numbers). Post one short `gh pr comment` saying which
            body-scoped findings are now resolved and which still stand.
            This exists because a body edit pushes no commit, so without
            it a description finding can never be confirmed fixed — and
            the next round reports it as still open when it isn't.
            — Repeat findings escalate. A finding raised in an earlier
            round and still unaddressed must NOT be restated at the same
            volume as a new one: it is stronger evidence than a first
            sighting, because it has now survived a round of attention.
            Lead your comment with a `**Unaddressed from N prior
            round(s):** ...` line naming each one before any new
            findings. Three consecutive identical restatements buried at
            the bottom of a summary is the observed failure (#493,
            2026-07-29) — the author fixed every inline finding and
            stepped over the repeated one twice.
            — Scope claims about mutable state to when you looked. Issue
            and PR state changes under you: a finding that says "#490 is
            open, so this isn't fixed" can invert within the hour if #490
            merges, taking your recommended remedy with it. Write such
            claims as "as of this review, #490 is open" and say what
            would change the conclusion.
          # Model pinned rather than left to the action's default: review
          # quality and cost both depend on it, and an unpinned default can
          # move under us without any change to this file.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"

      # Full session transcript (includes every permission denial) — the
      # difference between forensics and guesswork when a run misbehaves.
      - name: Upload execution transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14

      # Historically a green check only meant "the session exited cleanly"
      # — five separate failure classes ended with nothing posted and a
      # green check (docs/review-bot.md). This step makes silence loud: a
      # non-trivial PR with zero review activity fails the check. Carve-outs
      # mirror the plugin's designed skips (drafts, workflow-file PRs via
      # the action's anti-hijack self-skip, tiny diffs, already-reviewed).
      - name: Guard — silent no-op must not green-check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -uo pipefail
          # Fork PR: the review step above is gated off (no secrets reach a
          # fork's `pull_request` run), so there is nothing for this guard to
          # find and failing here would be an unclearable block on an outside
          # contributor. Skipping the guard cannot hide an abandonment — the
          # review provably never started. Such PRs need session-side review,
          # same rule as workflow-file PRs (CLAUDE.md "Workflow").
          if [ -n "${HEAD_REPO:-}" ] && [ "${HEAD_REPO}" != "${REPO}" ]; then
            echo "Fork PR ($HEAD_REPO != $REPO) — review step gated off, no secrets available. Needs session-side review."
            exit 0
          fi
          # Description-edit runs carry no new commit, so head-SHA coverage is
          # owned by whichever push event produced that head — every SHA gets
          # an `opened` or `synchronize` run. Enforcing here would red a PR for
          # a body edit whose cheap re-check legitimately had nothing to post.
          # Carving this out cannot lose coverage on any SHA.
          if [ "${EVENT_ACTION:-}" = "edited" ]; then
            echo "Description-edit run — no new head SHA; coverage is enforced by the push events."
            exit 0
          fi
          # Fail-open on API errors: the guard is a safety net, and its own
          # flakiness must never block a merge. It fails ONLY on confirmed
          # zero-coverage abandonment.
          if ! draft=$(gh pr view "$PR" -R "$REPO" --json isDraft --jq .isDraft); then
            echo "::warning::guard: gh pr view failed (transient?) — failing open."; exit 0
          fi
          if [ "$draft" = "true" ]; then
            echo "Draft PR — plugin gate skips these by design; guard not applicable."
            exit 0
          fi
          # Deliberately broader than the action's actual self-skip (which
          # keys on the executing workflow file): over-carving fails safe,
          # because workflow-file PRs get session-side review by repo rule.
          if ! wf_files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '[.[] | select(.filename | startswith(".github/workflows/"))] | length' | awk '{s+=$1} END {print s+0}'); then
            echo "::warning::guard: files query failed — failing open."; exit 0
          fi
          if [ "$wf_files" -gt 0 ]; then
            echo "PR touches workflow files — action self-skips these (anti-hijack); guard not applicable."
            exit 0
          fi
          changed=$(gh pr view "$PR" -R "$REPO" --json additions,deletions --jq '.additions + .deletions') || changed=""
          case "$changed" in ''|*[!0-9]*)
            echo "::warning::guard: could not determine diff size — failing open."; exit 0;;
          esac
          if [ "$changed" -lt 20 ]; then
            echo "Diff is $changed changed lines (<20) — triviality-gate territory; guard not applicable."
            exit 0
          fi
          # A follow-up push that adds only a few lines does not need its own
          # review — mirrors the whole-PR triviality gate above, applied to
          # the delta. Only reachable on `synchronize`, where a range exists.
          if [ "${EVENT_ACTION:-}" = "synchronize" ] && [ -n "${PUSH_BEFORE:-}" ] \
             && [ "${PUSH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            if delta=$(gh api "repos/$REPO/compare/${PUSH_BEFORE}...${HEAD_SHA}" \
                        --jq '[.files[]?.changes] | add // 0'); then
              case "$delta" in ''|*[!0-9]*) delta="";; esac
              if [ -n "$delta" ] && [ "$delta" -lt 20 ]; then
                echo "Push changed $delta lines (<20) — triviality-gate territory; guard not applicable."
                exit 0
              fi
            else
              echo "::warning::guard: compare query failed — treating push as substantive."
            fi
          fi
          # Coverage must be on the CURRENT HEAD, not merely somewhere in the
          # PR's lifetime.
          #
          # This was PR-lifetime until 2026-07-29, on the reasoning that the
          # plugin declines to re-review a PR it has already commented on, so
          # per-SHA enforcement would red every follow-up push. The cost of
          # that choice showed up on #481: the bot reviewed one commit, found
          # four real bugs including one in shipped code, and six further
          # commits — containing the fixes for those very bugs — merged
          # unreviewed behind a green check. Follow-up commits are the
          # HIGHER-risk half: written fast, in response to a review, by
          # someone who now believes they understand the problem.
          #
          # #484 fixed the behaviour (the prompt now refuses "already
          # reviewed" as a skip and is handed its before..after range); this
          # enforces it. If a run skips a substantive push anyway, the check
          # goes red rather than reporting a review that did not happen.
          #
          # Attribution, and the field choice matters more than it looks.
          #
          # A review's `commit_id` is PINNED to the SHA it reviewed. An inline
          # comment's `commit_id` ADVANCES as the PR moves, so the comment
          # keeps pointing at its line — using it here would attribute a
          # six-pushes-old comment to the current head and make this guard
          # silently useless. Verified against #481: 5 of its inline comments
          # report `commit_id` == head while every one was written against a
          # commit six pushes earlier. `original_commit_id` is the pinned one.
          #
          # A bot summary comment carries no SHA at all, so it is attributed by
          # time — created after the head commit's own timestamp. That is a
          # heuristic, and deliberately the generous one: it can only admit
          # coverage, never deny it.
          if ! reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
                --jq "[.[] | select(.commit_id == \"$HEAD_SHA\")] | length" \
                | awk '{s+=$1} END {print s+0}'); then
            echo "::warning::guard: reviews query failed — failing open."; exit 0
          fi
          if ! inline=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate \
                --jq "[.[] | select(.original_commit_id == \"$HEAD_SHA\")] | length" \
                | awk '{s+=$1} END {print s+0}'); then
            echo "::warning::guard: inline-comments query failed — failing open."; exit 0
          fi
          if ! head_time=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.commit.committer.date'); then
            echo "::warning::guard: head-commit query failed — failing open."; exit 0
          fi
          if ! bot_summaries=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq "[.[] | select((.user.login == \"claude[bot]\" or .user.login == \"claude\") and .created_at > \"$head_time\")] | length" \
                | awk '{s+=$1} END {print s+0}'); then
            echo "::warning::guard: issue-comments query failed — failing open."; exit 0
          fi
          echo "coverage on $HEAD_SHA: reviews=$reviews inline=$inline bot_summaries=$bot_summaries"
          if [ "$reviews" -gt 0 ] || [ "$inline" -gt 0 ] || [ "$bot_summaries" -gt 0 ]; then
            echo "Review coverage exists for the current head — OK."
            exit 0
          fi
          # Zero coverage. Distinguish a conscious plugin gate-skip (cheap,
          # few turns: ~2-6 observed) from mid-review abandonment (the
          # class-5 signature: 16-20 turns, then nothing). Threshold 8 sits
          # between the observed clusters; see docs/review-bot.md.
          turns=$(grep -o '"num_turns"[[:space:]]*:[[:space:]]*[0-9]*' "${RUNNER_TEMP}/claude-execution-output.json" 2>/dev/null | tail -1 | grep -o '[0-9]*$' || true)
          if [ -n "$turns" ] && [ "$turns" -le 8 ]; then
            echo "No coverage, but the transcript shows a cheap conscious run (num_turns=$turns <= 8) — plugin gate-skip signature, not abandonment. Passing."
            exit 0
          fi
          echo "::error title=No review for this head commit::claude-review exited green but PR #$PR has no review, inline comment, or bot summary attributable to head $HEAD_SHA (transcript turns: ${turns:-unknown}). Either the run never reviewed (the silent no-op class), or it skipped a substantive follow-up push — the failure #481 merged behind. See docs/review-bot.md. Escape hatch if the skip was legitimate: re-run this job (runs are stochastic), or post a review on the current head and re-run the check."
          exit 1
