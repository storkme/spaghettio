# Independent PR reviewer: the storkme/second-opinion action driving DeepSeek
# V4 Flash via OpenRouter. Takes over from claude-code-review.yml as the CI
# reviewer (2026-08-01) — CI reviews were consuming the Claude subscription's
# usage windows; this runs on metered OpenRouter credit (~cents/PR) instead.
# The claude workflow is parked (not deleted) in the phase-2 PR of the swap;
# until that merges both reviewers run. See docs/review-bot.md.
#
# Needs one repo secret: OPENROUTER_API_KEY.
name: Second Opinion

on:
  pull_request:
    # `labeled` exists for the trivial-delta gate's `force-review` escape
    # hatch: after a docs-only skip there may be nothing left to push, so
    # applying the label must itself trigger the review. Stray label
    # events on quiet PRs are near-free: an already-reviewed head exits
    # via the gate's `identical` fast path with no container spin; a
    # skipped head re-skips with a deduped notice.
    types: [opened, synchronize, ready_for_review, reopened, labeled]
    # KNOWN GAP (from this workflow's own first review, #561), NARROWED by
    # the trivial-delta gate (#633): no `edited` type, so a base-branch
    # retarget — which rewrites the effective diff without a new head
    # SHA — keeps the old SHA's green check *at retarget time*. Adding the
    # trigger wouldn't help: the runner's per-SHA marker comment would
    # suppress the re-review anyway, and the action exposes no force
    # input. The gate's timeline guard now forces a full review on the
    # next PUSH after a retarget. A label event cannot heal it: the gate
    # votes review, but the head SHA is unchanged and the runner's
    # per-SHA gate suppresses the re-review (the force-input gap above).
    # So the residual gap is a retarget followed by no further push
    # before merge: re-review THAT case session-side (the stacked-PR
    # retarget-to-main case is the one that occurs here).

# One concurrency group per PR; cancellation is CONDITIONAL on the event.
# Only `synchronize` — the one trigger that means "a new head SHA exists" —
# cancels the in-progress run: a superseded SHA's review is real money (this
# action bills per review) and its check lands on a commit that can no longer
# be merged, so cancelling there stays correct. Same-head re-events
# (`reopened`, `ready_for_review`) must NOT cancel: an unconditional
# cancel-in-progress let a close/reopen of #576 kill the in-progress run OF
# THE SAME SHA ("Canceling since a higher priority waiting request for
# second-opinion-576 exists", 2026-08-06), and a cancelled run leaves this
# REQUIRED check with no successful conclusion — the PR is unmergeable until
# someone overrides protection. Failure class 11 in docs/review-bot.md has
# the forensics. Under the conditional, a same-head event queues behind the
# running review (GitHub keeps one running + one pending per group) and is
# near-free when its turn comes: the runner resolves the PR's head at
# execution time and its per-SHA marker gate (`already_reviewed`, checked
# before any model call) exits 0 green without spending.
# NOT keyed on head.sha: that also fixes the same-SHA cancel, but it puts
# each push in a fresh group, so a superseded run is never cancelled — the
# exact spend the cancellation exists to stop. No `edited` trigger (unlike
# the parked claude-review workflow): this reviewer files no
# description-scoped findings, so the event-class keying saga (#521) does
# not apply here — one group per PR remains correct.
concurrency:
  group: second-opinion-${{ github.event.pull_request.number }}
  # Evaluated on the NEWLY queued run: true only when that run carries a new
  # head SHA worth yielding to.
  cancel-in-progress: ${{ github.event.action == 'synchronize' }}

jobs:
  second-opinion:
    # NO job-level `if` — same reasoning as the parked claude-review job
    # (#497): this check is REQUIRED on main, and a job skipped by a
    # job-level `if` publishes a check run with conclusion `skipped`, whose
    # required-check semantics are not something to bet a merge queue on.
    # The gates live lower instead: the runner itself skips drafts with a
    # real green conclusion (exit 0), and the fork gate is on the step.
    runs-on: ubuntu-latest
    # Budget, worst case, PARALLEL passes (verified: @v1 == v1.5.0 uses a
    # ThreadPoolExecutor for OpenRouter, so K=3 costs ~one pass of wall-clock):
    #   1800s slowest pass + 1200s merge + ~300s cold image build = ~55 min.
    # The merge is 1200s not 600s because second-opinion retries it once on a
    # flake (its #21), each attempt with its own 600s HTTP timeout — raising the
    # pass timeout without re-doing this arithmetic is how the cap gets eaten.
    # 90 min leaves ~35 min of margin on that path. It does NOT cover a
    # sequential fallback: 3 x 1800 + 1200 = 110 min, over the cap. The
    # protection here rests entirely on passes being parallel, which is verified
    # against the pinned action rather than assumed — if a future version ever
    # serialised them, the job cap would fire mid-pass and skip the degraded
    # report (no annotation, no failure notice), which is strictly worse than
    # the pass timeout it replaces. Re-check parallelism before trusting this
    # budget across an action upgrade.
    # Typical observed runtime is ~15-20 min.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      # actions: write is needed by the upload-artifact step below.
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivial-delta gate
        # #632 C8 (review-tail): a push whose delta since the last ACTUALLY
        # REVIEWED head is docs-only (*.md) and/or comment-only Rust does not
        # buy a new K=3 review. The repo's own conventions generate such
        # pushes constantly (decision-log commits, attribution-comment
        # sweeps), and each cost a full review (~$0.02-0.32, 15-20 min) that
        # can only re-find already-adjudicated items — 4 of PR #630's 10
        # rounds were this loop.
        #
        # Semantics, chosen so skips can never hide code:
        # - The baseline is the newest `<!-- second-opinion sha=... -->`
        #   marker — the last head a review actually POSTED for. Skipped
        #   pushes deliberately post a DIFFERENT marker, so trivial deltas
        #   ACCUMULATE against the reviewed baseline: the first push whose
        #   cumulative delta touches code gets a full-PR-diff review.
        # - Comment-only Rust = every +/- patch line is blank or starts
        #   with `//` after indent (compare-API patch, headers excluded).
        #   A code line with a trailing comment edit does NOT match — that
        #   counts as code. Known residual over-skip: an .rs string literal
        #   whose line starts with `//` inside the quotes; accepted, none
        #   exist in this codebase's committed source today.
        # - Everything else fails toward review: no prior marker, diverged
        #   or force-pushed history, renames, non-md/rs files, missing or
        #   oversized patches (>=300 files), any API error.
        # - Escape hatch: the `force-review` label disables the gate for
        #   the PR.
        # Fork PRs skip the gate (read-only token can't post the audit
        # comment); they keep today's behavior — no review, session-side
        # rule applies.
        id: delta
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          trivial=false
          notice=false
          last=""
          if jq -e '[.pull_request.labels[].name] | index("force-review")' "$GITHUB_EVENT_PATH" >/dev/null; then
            reason="force-review label present"
          else
            # NB --paginate + --jq filters PER PAGE and concatenates, so a
            # >100-comment thread can emit one line per page — tail -n1
            # keeps the newest marker across pages (pages arrive oldest
            # first).
            # The marker alone is NOT proof of ownership: claude[bot]
            # posts byte-identical `<!-- second-opinion sha=... -->`
            # markers naming DIFFERENT commits (live evidence:
            # storkme/second-opinion#49), and a foreign marker naming a
            # mid-PR commit measures a SMALLER delta than the truly
            # unreviewed one. Require the review header too; if the
            # action ever rewords it, the baseline is lost and the gate
            # fails toward review — the safe direction.
            # grep -v ^$ is belt-and-braces: jq `empty` should emit no line
            # for marker-less pages, but a blank line reaching tail -n1
            # would silently lose the baseline (fail-toward-review, so safe
            # but defeats the gate on long threads).
            anchor=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
              --jq '[.[] | select(.body | test("^<!-- second-opinion sha=[0-9a-f]{40} -->")) | select(.body | contains("### 🤖 Second opinion")) | {s: (.body | capture("sha=(?<s>[0-9a-f]{40})").s), t: .created_at}] | last // empty | "\(.s) \(.t)"' \
              | grep -v '^$' | tail -n1 || true)
            last=${anchor%% *}
            last_at=${anchor#* }
            if [ -z "$last" ]; then
              reason="no prior review marker on this PR"
            # BASE-RETARGET GUARD (round-4 critical): the compare below sees
            # only head-side commits. A base retarget rewrites the effective
            # base...head diff with NO new head SHA — the workflow's known
            # `edited`-trigger gap — and pre-gate, the next push healed it
            # with a full review. The gate must not turn that push into a
            # skip. Detect: any base_ref_changed (or automatic base change)
            # timeline event NEWER than the anchor review forces a review.
            # Every failure here (timeline API error, jq error, missing
            # anchor timestamp) also forces a review.
            elif ! tl=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/timeline" --paginate 2>/dev/null); then
              reason="review:timeline-api-failed"
            else
              # max, not last: `last` silently assumes the timeline API
              # returns events oldest-first (true today, but an ordering
              # change would make `last` pick the OLDEST of several
              # retargets and miss a recent one). ISO-8601 UTC max is
              # chronological max regardless of order; "unknown-time"
              # sorts above any date and keeps forcing review.
              retarget=$(jq -rn '[inputs] | add // [] | [.[] | select(.event == "base_ref_changed" or .event == "automatic_base_change_succeeded") | .created_at // "unknown-time"] | max // empty' <<<"$tl" 2>/dev/null) || retarget="jq-failed"
              # The anchor timestamp is the review's POST time — up to a
              # full job budget (timeout-minutes: 90) after the diff was
              # actually fetched. A retarget landing DURING the in-flight
              # review is older than the anchor yet unreviewed, so compare
              # against anchor minus that budget (round-5 major). A false
              # fire inside the margin costs one full review — the safe
              # direction — and this also closes the same-second >-vs->=
              # nit. date failure leaves threshold empty, forcing review.
              threshold=""
              if [ -n "$last_at" ]; then
                threshold=$(date -u -d "${last_at} -90 minutes" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)
              fi
              if [ -n "$retarget" ] && { [ "$retarget" = "jq-failed" ] || [ "$retarget" = "unknown-time" ] || [ -z "$threshold" ] || [[ "$retarget" > "$threshold" ]]; }; then
                reason="review:base-retargeted-since-anchor"
              else
              verdict=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${last}...${HEAD_SHA}" --jq '
                # identical = a same-head re-event (reopened /
                # ready_for_review / stray label) on the reviewed head:
                # skip WITHOUT a notice, saving the container spin the
                # action would burn reaching its own per-SHA gate. Do not
                # "fix" this into history-diverged — nor vice versa.
                if .status == "identical" then "identical"
                elif .status != "ahead" then "review:history-diverged"
                # null/absent .files is a malformed or partial response, NOT
                # an empty delta — it must fail toward review (bot round-3
                # major: null[] iterates to zero and read as "skip"). A
                # genuinely EMPTY list (status ahead, zero changed files —
                # e.g. an empty commit) stays a skip: there is nothing to
                # review and the runner per-SHA gate cannot catch it.
                elif (.files == null) then "review:compare-api-failed"
                elif (.files | length) >= 300 then "review:file-list-truncated"
                else
                  [ .files[] |
                    if .previous_filename then "code"
                    elif (.filename | test("\\.md$")) then "ok"
                    elif (.filename | test("\\.rs$")) and .status == "modified" and (.patch != null) and ((.patch | length) < 10000) then
                      # Compare-API patches start at the first @@ hunk and
                      # carry NO +++/--- file headers — do not "skip" them:
                      # that exclusion misreads a genuine added line whose
                      # content begins with "++" (found in upstreaming,
                      # storkme/second-opinion#47).
                      # The <10000-char cap is truncation insurance: a
                      # partially-delivered patch could show only comment
                      # lines while cut hunks hide code. Genuine
                      # comment-only sweeps are small; a big patch is
                      # "code" regardless of its visible lines.
                      if ([ .patch | split("\n")[] |
                            select(test("^[+-]")) |
                            select(test("^[+-][[:space:]]*(//.*)?$") | not)
                          ] | length) == 0
                      then "ok" else "code" end
                    else "code" end
                  ] | if length == 0 or all(. == "ok") then "skip" else "review:code-in-delta" end
                end' 2>/dev/null || echo "review:compare-api-failed")
              if [ "$verdict" = "skip" ]; then
                trivial=true
                notice=true
                reason="docs/comment-only delta since reviewed ${last:0:9}"
              elif [ "$verdict" = "identical" ]; then
                trivial=true
                reason="head is already the reviewed head (same-head re-event)"
              else
                reason="$verdict"
              fi
              fi
            fi
          fi
          echo "trivial=$trivial" >> "$GITHUB_OUTPUT"
          echo "notice=$notice" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "gate: trivial=$trivial ($reason)"
      - name: Record skipped review
        # The audit trail for a skip: a comment with a marker DISTINCT from
        # the review marker (so the gate above keeps measuring against the
        # last real review), naming the baseline and the escape hatch. A
        # skip must never be silent — silence ≠ clean is this workflow's
        # founding rule. Deliberately load-bearing: if this POST fails, the
        # job fails — a green skip with no audit trail would be the silent
        # clearance this workflow exists to prevent (same philosophy as
        # fail-on-degraded). The `identical` fast path sets notice=false —
        # nothing new to say about a head that already carries its review.
        if: steps.delta.outputs.trivial == 'true' && steps.delta.outputs.notice == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAST: ${{ steps.delta.outputs.last }}
        run: |
          set -euo pipefail
          # Dedup per head: a same-head re-event (reopened /
          # ready_for_review) re-runs the gate; don't re-post the notice.
          # Capture-then-match, NOT a pipe into grep -q: -q closes the
          # pipe on first match, the still-writing gh gets SIGPIPE (141),
          # pipefail turns the hit into a non-zero condition, and the
          # step falls through to re-post — the round-5 review
          # demonstrated the race on long threads.
          bodies=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq '.[].body' || true)
          case "$bodies" in
            *"<!-- second-opinion-skip sha=${HEAD_SHA} -->"*)
              echo "skip notice already posted for ${HEAD_SHA:0:9}"
              exit 0;;
          esac
          printf '<!-- second-opinion-skip sha=%s -->\n**Second opinion — skipped for %s**: the delta since the last reviewed head (%s) is docs-only / comment-only. Trivial deltas accumulate — the first push whose cumulative delta touches code gets a full-PR review. Apply the `force-review` label to force one (and remove it afterwards — the gate is disabled while it is present).\n' \
            "$HEAD_SHA" "${HEAD_SHA:0:9}" "${LAST:0:9}" > /tmp/skip-comment.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@/tmp/skip-comment.md >/dev/null
      - name: Second opinion review
        # Fork PRs get no secrets on `pull_request` (by design, not a leak),
        # so the action would fail on an empty key and red an unclearable
        # required check for an outside contributor. Such PRs need
        # session-side review — same rule as workflow-file PRs (CLAUDE.md
        # "Workflow"). The skipped step still yields a real job conclusion.
        # `!= 'true'` not `== 'false'`: on fork PRs the gate step is skipped
        # and its output is empty — empty must mean "review", not "skip".
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.delta.outputs.trivial != 'true'
        uses: storkme/second-opinion@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          # Runtime monitoring (second-opinion v1.7.0+): one JSON event per review
          # pushed to the estate's Grafana Cloud Loki, so cost, duration and
          # degraded-rate are visible without opening individual run logs. Highest
          # value here of the three consumers, because k:3 below means three passes
          # can degrade independently — the event carries pass_statuses (e.g.
          # "ok,timeout,ok") plus passes_ok/passes_degraded, so a review that quietly
          # became a union of 2 instead of 3 is greppable rather than invisible.
          # URL and instance id are repo variables (an unset var expands to "" and
          # disables metrics with no network call — vars.LOKI_URL is the kill
          # switch); only the token is a secret, scoped to logs:write.
          loki-url: ${{ vars.LOKI_URL }}
          loki-user: ${{ vars.LOKI_USER }}
          loki-token: ${{ secrets.LOKI_TOKEN }}
          # Tracing (second-opinion v1.8.0+): one OTLP trace per review, shaped
          # review > pass > model turn / tool call > merge. The Loki events above say a
          # review cost 7.8M tokens and took 13 minutes; they cannot say where either
          # went, because a review is a tree — 3 passes, each a back-and-forth of turns
          # and tool calls, then the union merge.
          #
          # Turned on here specifically, and not on the other two consumers, because this
          # is where the money is: k=3 over 300k-char diffs makes it by far the most
          # expensive of the three ($1.11 of $1.26 estate-wide so far), and the per-pass
          # Loki events showed a single review issuing 204 tool calls across its passes.
          # Which of those were worth issuing is a question only the trace can answer.
          #
          # Tool spans are reconstructed from pi's own JSONL session transcript after each
          # pass — pi has no OTLP of its own, so there is nothing to configure on its side,
          # and a transcript truncated by a killed pass just loses the inner spans rather
          # than the whole trace. Complements session-dir below rather than replacing it:
          # the artifact holds full fidelity (prompts, tool output), the trace holds shape
          # and timing without a download.
          #
          # Same rules as the Loki block: endpoint and instance id are repo VARIABLES (an
          # unset var expands to "" and disables tracing with no network call, so
          # vars.OTLP_ENDPOINT is the kill switch); only the token is a secret, scoped to
          # traces:write. NB otlp-user is the STACK id (1746138), which is NOT the same
          # number as loki-user (1703925) — copying the Loki one here is the easy mistake
          # and fails as a silent 401, since the exporter is fail-soft by design.
          otlp-endpoint: ${{ vars.OTLP_ENDPOINT }}
          otlp-user: ${{ vars.OTLP_USER }}
          otlp-token: ${{ secrets.OTLP_TOKEN }}
          # DeepSeek V4 Flash (2026-07-31 release): 1M context, currently
          # $0.08/Mtok input, $0.18 output, $0.016 cache read (checked against
          # OpenRouter's models API 2026-08-22 — the old "~$0.14/M input" here
          # was stale). Pinned rather than left to the action's default for the
          # same reason claude-review pinned its model: review quality and cost
          # both depend on it.
          #
          # Through a repo VARIABLE so the pin can be moved without a PR, the same
          # pattern as loki-url/otlp-endpoint above. That matters here specifically
          # because `second-opinion` is a REQUIRED check on main: a model id that is
          # wrong, withdrawn, or reliably erroring blocks every merge on the repo,
          # and with the literal inline the only way to unblock it is another PR
          # through the gate that is already stuck. As a variable it is a settings
          # revert. Unset falls back to the value below, so nothing changes until someone
          # sets one — but note that is the only case it protects: a set-but-WRONG value
          # (a typo'd id, or SECOND_OPINION_K=0, which GitHub's expression engine treats
          # as truthy because it is a non-empty string) beats the default and blocks the
          # gate exactly as a bad literal would. Unsetting it is the fix, and that is
          # still a settings edit rather than a PR — which is the whole point.
          #
          # THE MODEL DOES NOT TRAVEL ALONE. max-tokens, max-diff-chars,
          # pass-timeout-seconds and max-pass-tokens below are ALL calibrated to THIS
          # model — its 65536-token cap, its 1M context, its speed on these diffs, its
          # measured per-pass burn — and are variables for the same reason. Swapping to a
          # smaller-context, slower or leakier model without moving them re-triggers the
          # empty-review failure class those comments document, silently and with no file
          # change to review. Set them in the same visit.
          #
          # AND MIND THE JOB CAP. pass-timeout-seconds is now settable from Settings, but
          # `timeout-minutes: 90` on the job is not. The budget arithmetic below assumes
          # 1800s; past roughly 2400s the worst case exceeds 90 minutes and the JOB cap
          # fires mid-pass instead, which is strictly worse than a pass timeout — it skips
          # the degraded report entirely, so there is no annotation and no failure notice,
          # just a red required check with nothing explaining it. Raise timeout-minutes in
          # the same PR if you raise this past ~2400.
          model: ${{ vars.SECOND_OPINION_MODEL || 'deepseek/deepseek-v4-flash-0731' }}
          # Flash-tier model, so union 3 independent agentic passes — the
          # recall lever the second-opinion README prescribes for weaker
          # models. Passes are sampled; the union keeps a finding if ANY
          # pass raises it. Still ~cents per PR at this pricing.
          #
          # A variable for the same unblocking reason, plus one of its own: k
          # multiplies the bill directly (k passes plus a merge call per review), so
          # it is the knob most likely to want turning in a hurry. Turning it DOWN
          # trades recall for cost and that trade is measurable — run
          # `second-opinion-eval --auto 5` at each value rather than guessing.
          k: ${{ vars.SECOND_OPINION_K || '3' }}
          # Generated artifacts are enormous here and sort BEFORE crates/ in git
          # path order, and the diff filter stops at the first file chunk that
          # overflows the cap rather than skipping it — so they deterministically
          # starve the source files behind them. Measured on #575: the excerpt
          # carried 1 of 16 changed files (a single artifact HTML, itself clipped
          # mid-file) and all 12 Rust sources went unseen, with the check green.
          # Dropping artifacts/** takes that PR to 13 of 16 — every source file —
          # at the 300k cap set below. (12 of 16 at the previous 200k cap; the
          # earlier "12" figure predates the cap bump.)
          # `**/*.fls` covers the repo's OTHER committed generated blobs: 10 snapshot
          # dumps, ~144KB, regenerated and committed by the very layout PRs this
          # reviews — the same starvation vector under a different name. (The 645
          # PNGs under web/public/icons are already covered by the default **/*.png.)
          # `artifacts/**` has no files on main yet — it arrives with #575, whose diff
          # is where the starvation was measured (3 files, 84% of that diff).
          # NOTE: this input REPLACES the action's default list rather than
          # extending it, so the defaults are re-listed here verbatim. Adding a
          # glob without them would silently re-admit lockfiles and images.
          # `>-` folds newlines to spaces; the action strips each glob so that is
          # harmless, but writing it unfolded means nobody has to know that.
          exclude-globs: >-
            **/*.lock,**/package-lock.json,**/yarn.lock,**/pnpm-lock.yaml,
            **/Cargo.lock,**/go.sum,**/*.min.js,**/*.map,
            **/build/**,**/dist/**,**/node_modules/**,**/vendor/**,
            **/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,**/*.svg,
            **/*.pdf,**/*.ico,
            artifacts/**,**/*.fls
          # The 60k default was sized for 128k-context models. This model
          # has 1M context, and layout-engine PRs here routinely exceed
          # 60k chars of diff. 300k because 200k still truncated #575 once
          # artifacts were excluded (its source alone is ~214k).
          max-diff-chars: ${{ vars.SECOND_OPINION_MAX_DIFF_CHARS || '300000' }}
          # 65536 = deepseek-v4-flash-0731's cap. A reasoning model can exhaust a
          # smaller max_tokens in its reasoning channel and return an empty 200
          # (the #565/#566/#574 empty-review failure class), so give it headroom.
          max-tokens: ${{ vars.SECOND_OPINION_MAX_TOKENS || '65536' }}
          # 900s (the action default at time of writing) is too tight for a
          # reasoning model on these diffs: #575 and #574-attempt-1 both had ALL
          # passes hit the wall and post nothing, and the attempt that did
          # succeed on #574 used 827/779/787s of 900 — 87-92%, a coin flip per
          # run. K=3 does not cover this: parallel passes give redundancy when
          # ONE pass fails, but a systematic cause takes all three together.
          # Redundant with the action's own default since v1.5.0, kept as an
          # explicit guard so a future default change cannot silently shorten it.
          # See the job-budget comment above: the merge can retry once, so the
          # worst case is 1800 + 1200 + build, not 1800 + 600.
          pass-timeout-seconds: ${{ vars.SECOND_OPINION_PASS_TIMEOUT || '1800' }}
          # Spend ceiling. The wall clock above bounds TIME, not money: a looping agent
          # burns tokens at full rate for the whole 1800s and a longer timeout only
          # raises the bill (#29 elsewhere: 12.6M tokens producing nothing, ended only by
          # the clock). Until now nothing here bounded spend except the OpenRouter key's
          # monthly cap — a blunt instrument that stops every review across every repo
          # once tripped, which is what happened on 2026-08-06.
          #
          # 6M chosen from this repo's own measured spend (Loki, 12 posted reviews):
          #   - biggest review 7.81M tokens at k=3 -> ~2.60M mean per pass
          #   - measured intra-review spread, largest pass vs mean: 1.10x / 1.20x / 1.31x
          #   - so the largest plausible LEGITIMATE pass is ~3.4M (2.60M x 1.31)
          # 6M clears that by 1.8x, which matters because a killed legitimate pass posts
          # no review and reds the check — reviewer malfunction reported as a verdict, the
          # exact failure this repo already hit twice on timeouts. It still cuts an
          # #29-class runaway at less than half its burn.
          #
          # Note it is a per-PASS ceiling and k=3, so the bound on a pathological review
          # is 3x this: ~18M ~= $0.48 at the $0.027/M this repo actually pays (heavy cache
          # reads make token counts much larger than cost would suggest). Typical reviews
          # here cost $0.02-$0.17, so this only ever fires on an outlier.
          #
          # Deliberately NOT max-pass-cost-usd: that depends on a price lookup that can
          # fail, and a failed lookup is left uncached, so a cost-only ceiling degrades to
          # a no-op while stalling on the fetch. Tokens are read straight from the
          # transcript. Revisit if per-pass events show a legitimate pass above ~4M.
          max-pass-tokens: ${{ vars.SECOND_OPINION_MAX_PASS_TOKENS || '6000000' }}
          # Persist per-pass pi session transcripts under the runner workspace so
          # the step below can upload them as an artifact. Lets us replay a
          # blocked/empty review pass (and read real token/cost usage) instead of
          # relying on OpenRouter's opt-in logging. Transcripts are secret-redacted
          # before the upload step below keeps them.
          # NOT a dotted path: this was `.second-opinion` and every run logged
          # "No files were found with the provided path", uploading nothing, while
          # the review footer still reported real token counts — proving the
          # transcripts existed and were read. upload-artifact@v4 excludes hidden
          # files by default, and a leading-dot directory is hidden. Renaming
          # removes the variable entirely rather than relying on the opt-in below.
          session-dir: /github/workspace/second-opinion-sessions
          # guidance-file: .github/review-guidance.md
          # ^ enable once the checklist is bootstrapped from review history
          #   (second-opinion-bootstrap) and committed.
      - name: Upload review session transcripts
        # `always()` so a failing (e.g. empty-review) run still keeps its transcripts.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: second-opinion-sessions-${{ github.event.pull_request.number }}
          path: ${{ github.workspace }}/second-opinion-sessions
          # Belt and braces alongside the un-dotted path above: v4 excludes hidden
          # files by default, so a future dotted path would silently upload nothing.
          include-hidden-files: true
          # `warn`, not `ignore`. With `ignore` this step reported success while
          # uploading nothing on every run since it was added — a green step doing
          # no work, which is the exact failure class this whole workflow exists to
          # catch. It must not be a required-check failure (a missing transcript is
          # not a bad review), but it must not be silent either.
          if-no-files-found: warn
